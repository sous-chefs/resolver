driver:
  name: vagrant

provisioner:
  name: chef_zero
  deprecations_as_errors: true
  product_name: cinc

verifier:
  name: inspec

platforms:
  - name: almalinux-8
  - name: almalinux-9
  - name: amazonlinux-2023
  - name: centos-stream-9
  - name: debian-12
  - name: fedora-latest
  - name: rockylinux-8
  - name: rockylinux-9
  - name: ubuntu-22.04
  - name: ubuntu-24.04

suites:
  - name: default
    run_list:
      - recipe[resolver-test::test_packages]
      - recipe[resolver-test::default]
  - name: systemd_resolved
    provisioner:
      named_run_list: systemd_resolved
    run_list:
      - recipe[resolver-test::test_packages]
      - recipe[resolver-test::systemd_resolved]
    includes:
      - fedora-latest
      - ubuntu-22.04
      - ubuntu-24.04
    verifier:
      inspec_tests:
        - test/integration/systemd_resolved
